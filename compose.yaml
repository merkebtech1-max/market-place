services:
  postgres:
    image: postgres:17-alpine
    container_name: merkeb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: merkeb_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - merkeb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d merkeb_market"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  merkeb_postgres_data:
